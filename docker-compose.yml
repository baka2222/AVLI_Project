services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${AVLI_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ${AVLI_ENV_FILE:-.env}
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application
             --bind 0.0.0.0:8000
             --workers 2
             --timeout 120
             --access-logfile -"
    volumes:
      - static_data:/app/backend/staticfiles
      - media_data:/app/backend/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: ${AVLI_ENV_FILE:-.env}
    environment:
      ACCOUNT_API_URL: http://django:8000/api/v1/account/lookup/
    depends_on:
      django:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      django:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:
