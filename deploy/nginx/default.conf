limit_req_zone $binary_remote_addr zone=account_lookup:10m rate=1r/s;

upstream avli_django {
    server django:8000;
    keepalive 16;
}

upstream avli_frontend {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 1d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/v1/account/lookup/ {
        limit_req zone=account_lookup burst=10 nodelay;
        proxy_pass http://avli_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Существующая система учёта, отчёты и админка остаются в Django.
    location ~ ^/(admin|api|account|receipts|reports)(/|$) {
        proxy_pass http://avli_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /healthz {
        proxy_pass http://avli_django;
        proxy_set_header Host $host;
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://avli_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Маркетинговый сайт и Next.js Server Actions.
    location / {
        proxy_pass http://avli_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
